{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Document</title>
    <style>
    *{
    margin:0;
    padding:0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

body{
    background-image: url('{% static "annonces/images/l.jpg" %}') ;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-form{
    width: 420px;
    background: transparent;
    border: 2px solid rgba(255, 255, 255, .2);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 10px  rgba(0, 0, 0, .2);
    color: white;
    border-radius: 10px;
    padding: 30px 40px;
    
}

.login-form h1{
    font-size: 36px;
    text-align: center;

}

.login-form .input-box{
    position: relative;
    width:100%;
    height: 50px;
    margin: 30px 0;
}

 .login-form .input-box input{
     width: 100%;
     height: 100%;
     background: transparent;
     outline: none;
     border : 2px solid rgba(255,255,255, .2);
     border-radius: 40px;
     color: white;
     font-size: 18px;
     padding: 20px 45px 20px 20px;
 }
 .login-form .input-box input::placeholder{
     color: white;
 }
  .login-form .input-box i{
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      font-size: 20px;
  }

  .login-form .Remember-forget{
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin: -15px 0 15px ;
  }

  .Remember-forget a{
      color: white;
      text-decoration: none;
  }
  .Remember-forget a:hover{
      text-decoration: underline;
  }

  .login-form .btn {
      background:  white;
      width: 100%;
      height: 45px;
      border: none;
      outline: none;
      border-radius: 40px;
      box-shadow: 0 0 10px  rgba(0, 0, 0 ,.1);
      cursor: pointer;
      font-size: 16px;
      color: #333;
      font-weight: 600;
  }

  .login-form .btn:hover{
      text-decoration: green;
  }

  .login-form .Register-link{
      margin : 20px 0 15px;
      text-align: center;
      font-size: 14px;
  }

  .login-form .Register-link  p Link{
      color: white;
      text-decoration: none;
      font-weight: 600;

  }

  .login-form .Register-link:hover{
      text-decoration: underline;
  }
    </style>
</head>
<body>
    <div class="login-form">
            <h1>Connexion</h1>
            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}
                <div class="input-box">
                    <input
                        type="text"
                        name="username"
                        placeholder="Email"
                        required/>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input
                        type="password"
                        placeholder="Entrez votre mot de passe"
                        name="password"
                        required />
                    <i class='bx bxs-lock'></i>
                </div>

                <div class="Remember-forget">
                    <label> <input type = "checkbox" Remember me /> </label>

                    <a href="#" > Mot de passe oublié ? </a>
                </div>

                <button type="submit"  class="btn">Se connecter</button>

                <div className="Register-link">
                    <p> Pas de compte ?
                        <a href="{% url 'register' %}">S'inscrire</a>
                    </p>
                </div>

            </form>


        </div>
</body>
</html>
